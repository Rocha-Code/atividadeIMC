<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <section class="container">
    <h1>Tabela IMC</h1>
    <div class="wrapper-tabela">
      <div class="tabela-referencia-imc">
        <h2><span>IMC</span></h2>
        <span>Menor que 18,5</span>
        <span>Entre 18,5 e 24,9</span>
        <span>Entre 25 e 29,9</span>
        <span>Entre 30 e 34,9</span>
        <span>Entre 35 e 39,9</span>
        <span>Mais de 40</span>
      </div>

      <div class="tabela-referencia-resultado">
        <h2><span>Resultado</span></h2>
        <span>Abaixo do peso</span>
        <span>Peso normal</span>
        <span>Sobrepeso</span>
        <span>Obesidade grau 1</span>
        <span>Obesidade grau 2</span>
        <span>Obesidade grau 3</span>
      </div>
    </div>
    <form id = "formulario">
      <h1>Calcule seu IMC</h1>
        <div class = "input">
          <label for="peso">Peso (kg):</label>
          <input type="number" id="peso" name="peso" placeholder="Ex: 70" required>
        </div>
        
        <div class = "input">
          <label for="altura">Altura (m):</label>
          <input type="number" id="altura" name="altura" placeholder="Ex: 1.70" step="0.01" required>
        </div>
        <button type="submit">Calcular</button>

    </form> 

    <div id="resultado"></div>

  </section>

  <script src="./assets/js/main.js"></script>
</body>

</html>
